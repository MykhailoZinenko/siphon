# Second input of layer 1, across all six neurons.
# This is the column the reference implementation attacks, so results here are
# directly comparable with the original work.
name: "layer 1, input column 1"
column: 1
neurons: 6

profiling: data/rebuilt_firmware/campaign_column
attack: data/rebuilt_firmware/attack
firmware_config: firmware/source/network_config.h

window: [0, 10000]
profiling_traces: 1000
attack_traces: 300

# One point per neuron. The campaign leaves ~140 traces per template class, which
# is thin for a larger covariance matrix; raise this once more traces exist.
pois_per_neuron: 1
poi_separation: 300
